{% extends "base.html" %}
{% block content %}
<h1>Log in</h1>

<form id="login-form" method="POST" action="/login" novalidate>
    <div class="alert" id="error-login">{{ errors.get('login', '') }}</div>
    <div class="field">
        <label for="email">Email</label>
        <input type="text" id="email" name="email" value="{{ form.get('email', '') }}">
        <span class="error" id="error-email">{{ errors.get('email', '') }}</span>
    </div>
    <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password">
        <span class="error" id="error-password">{{ errors.get('password', '') }}</span>
    </div>
    <button type="submit">Log in</button>
</form>

<p class="switch">No account yet? <a href="/register">Register</a></p>

<script src="{{ url_for('static', filename='login.js') }}"></script>
{% endblock %}
