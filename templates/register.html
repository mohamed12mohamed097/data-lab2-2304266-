{% extends "base.html" %}
{% block content %}
<h1>Register</h1>

<form id="register-form" method="POST" action="/register" novalidate>
    <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" value="{{ form.get('name', '') }}">
        <span class="error" id="error-name">{{ errors.get('name', '') }}</span>
    </div>
    <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ form.get('email', '') }}">
        <span class="error" id="error-email">{{ errors.get('email', '') }}</span>
    </div>
    <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password">
        <span class="error" id="error-password">{{ errors.get('password', '') }}</span>
    </div>
    <div class="field">
        <label for="confirm_password">Confirm password</label>
        <input type="password" id="confirm_password" name="confirm_password">
        <span class="error" id="error-confirm_password">{{ errors.get('confirm_password', '') }}</span>
    </div>
    <button type="submit">Register</button>
</form>

<p class="switch">Already have an account? <a href="/login">Log in</a></p>

<script src="{{ url_for('static', filename='register.js') }}"></script>
{% endblock %}
