{% extends "base.html" %}
{% block content %}
<h1>To-Do</h1>
<p>Hi, {{ name }} <a href="/logout">Log out</a></p>

<form id="add-form" method="POST" action="/todos/add" novalidate>
    <input type="text" id="title" name="title" placeholder="What needs to be done?" value="{{ form_title }}">
    <button type="submit">Add</button>
    <span class="error" id="error-title">{{ error or '' }}</span>
</form>

{% if items %}
<ul>
    {% for item in items %}
    <li>{{ item.title }}{% if item.is_done %} (done){% endif %}</li>
    {% endfor %}
</ul>
{% else %}
<p>No to-dos yet.</p>
{% endif %}

<script src="{{ url_for('static', filename='todos.js') }}"></script>
{% endblock %}
